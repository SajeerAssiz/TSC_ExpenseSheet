<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Office 365</title>

    <!-- MSAL.js from CDN -->
    <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .navbar h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .auth-button {
            padding: 0.6rem 1.5rem;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .auth-button:hover {
            background: white;
            color: #667eea;
        }

        .main-content {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-top: 2rem;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .profile-header h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .profile-photo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .profile-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f0f0f0;
        }

        .photo-placeholder {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #f0f0f0;
        }

        .initials {
            color: white;
            font-size: 3rem;
            font-weight: bold;
        }

        .photo-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .file-input {
            display: none;
        }

        .upload-button {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .upload-button:hover {
            transform: translateY(-2px);
        }

        .upload-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group small {
            display: block;
            color: #666;
            margin-top: 0.25rem;
            font-size: 0.875rem;
        }

        .readonly {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .save-button {
            flex: 1;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .save-button:hover {
            transform: translateY(-2px);
        }

        .save-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .cancel-button {
            flex: 1;
            padding: 1rem;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cancel-button:hover {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #666;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-left {
                flex-direction: column;
                gap: 0.5rem;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <h1>My Profile</h1>
            <a href="index.html" class="nav-link">← Back to Directory</a>
        </div>
        <button id="authButton" class="auth-button" onclick="signOut()">Sign Out</button>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Loading Screen -->
        <div id="loadingScreen" class="loading">
            <div class="spinner"></div>
            <p>Loading your profile...</p>
        </div>

        <!-- Profile Form -->
        <div id="profileForm" class="profile-container hidden">
            <div class="profile-header">
                <h2>Update Your Profile</h2>
                <p style="color: #666;">Keep your information up to date</p>
            </div>

            <!-- Alert Messages -->
            <div id="alertContainer"></div>

            <!-- Photo Section -->
            <div class="profile-photo-section">
                <div id="currentPhoto"></div>
                <div class="photo-upload">
                    <input type="file" id="photoInput" class="file-input" accept="image/*">
                    <button type="button" class="upload-button" onclick="document.getElementById('photoInput').click()">
                        Change Photo
                    </button>
                    <small style="color: #666;">JPG, PNG or GIF (max 4MB)</small>
                </div>
            </div>

            <!-- Profile Form Fields -->
            <form id="profileUpdateForm">
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="displayName" readonly class="readonly">
                    <small>Contact your IT administrator to change your name</small>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" readonly class="readonly">
                    <small>Contact your IT administrator to change your email</small>
                </div>

                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="jobTitle" placeholder="Enter your job title">
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="department" placeholder="Enter your department">
                </div>

                <div class="form-group">
                    <label>Office Location</label>
                    <input type="text" id="officeLocation" placeholder="Enter your office location">
                </div>

                <div class="form-group">
                    <label>Mobile Phone</label>
                    <input type="tel" id="mobilePhone" placeholder="Enter your mobile phone">
                </div>

                <div class="form-group">
                    <label>Business Phone</label>
                    <input type="tel" id="businessPhone" placeholder="Enter your business phone">
                </div>

                <div class="button-group">
                    <button type="submit" class="save-button" id="saveButton">
                        Save Changes
                    </button>
                    <button type="button" class="cancel-button" onclick="window.location.href='index.html'">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // MSAL Configuration
        const msalConfig = {
            auth: {
                clientId: "68d7fcd3-6db4-427e-a2be-f1c8d914b555",
                authority: "https://login.microsoftonline.com/ce5c9e34-9906-4081-8a98-69ec394244f1",
                redirectUri: window.location.origin
            },
            cache: {
                cacheLocation: "sessionStorage",
                storeAuthStateInCookie: false
            }
        };

        const loginRequest = {
            scopes: ["User.Read", "User.ReadWrite"]
        };

        // Initialize MSAL
        const myMSALObj = new msal.PublicClientApplication(msalConfig);
        let accessToken = null;
        let currentUser = null;

        // Check if user is signed in
        window.addEventListener('load', async () => {
            const accounts = myMSALObj.getAllAccounts();
            if (accounts.length > 0) {
                myMSALObj.setActiveAccount(accounts[0]);
                await getTokenAndLoadProfile();
            } else {
                // Redirect to login
                window.location.href = 'index.html';
            }
        });

        // Sign Out
        async function signOut() {
            try {
                await myMSALObj.logoutPopup();
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        // Get Access Token
        async function getTokenAndLoadProfile() {
            try {
                const account = myMSALObj.getActiveAccount();
                if (!account) {
                    window.location.href = 'index.html';
                    return;
                }

                const response = await myMSALObj.acquireTokenSilent({
                    ...loginRequest,
                    account: account
                });

                accessToken = response.accessToken;
                await loadUserProfile();
            } catch (error) {
                console.error('Token error:', error);

                // Try interactive login if silent fails (e.g., consent needed)
                if (error.name === 'InteractionRequiredAuthError' || error.errorCode === 'consent_required' || error.errorCode === 'interaction_required') {
                    try {
                        const response = await myMSALObj.acquireTokenPopup(loginRequest);
                        accessToken = response.accessToken;
                        await loadUserProfile();
                    } catch (popupError) {
                        console.error('Popup error:', popupError);
                        hideLoading();
                        showAlert('You need to grant permission to edit your profile. Please try again and accept the permissions.', 'error');
                    }
                } else {
                    hideLoading();
                    showAlert('Failed to authenticate. Please try signing in again.', 'error');
                }
            }
        }

        // Load User Profile
        async function loadUserProfile() {
            try {
                const response = await fetch('https://graph.microsoft.com/v1.0/me', {
                    headers: {
                        'Authorization': 'Bearer ' + accessToken
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load profile');
                }

                currentUser = await response.json();
                displayProfile(currentUser);
                await loadUserPhoto();
            } catch (error) {
                console.error('Error loading profile:', error);
                showAlert('Failed to load your profile. Please try again.', 'error');
            } finally {
                hideLoading();
            }
        }

        // Display Profile
        function displayProfile(user) {
            document.getElementById('displayName').value = user.displayName || '';
            document.getElementById('email').value = user.mail || user.userPrincipalName || '';
            document.getElementById('jobTitle').value = user.jobTitle || '';
            document.getElementById('department').value = user.department || '';
            document.getElementById('officeLocation').value = user.officeLocation || '';
            document.getElementById('mobilePhone').value = user.mobilePhone || '';
            document.getElementById('businessPhone').value = user.businessPhones?.[0] || '';

            document.getElementById('profileForm').classList.remove('hidden');
        }

        // Load User Photo
        async function loadUserPhoto() {
            try {
                const response = await fetch('https://graph.microsoft.com/v1.0/me/photo/$value', {
                    headers: {
                        'Authorization': 'Bearer ' + accessToken
                    }
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const photoUrl = URL.createObjectURL(blob);
                    displayPhoto(photoUrl);
                } else {
                    displayPlaceholder();
                }
            } catch (error) {
                displayPlaceholder();
            }
        }

        // Display Photo
        function displayPhoto(photoUrl) {
            const photoContainer = document.getElementById('currentPhoto');
            photoContainer.innerHTML = `<img src="${photoUrl}" alt="Profile Photo" class="profile-photo">`;
        }

        // Display Placeholder
        function displayPlaceholder() {
            const photoContainer = document.getElementById('currentPhoto');
            const initials = getInitials(currentUser.displayName);
            photoContainer.innerHTML = `
                <div class="photo-placeholder">
                    <span class="initials">${initials}</span>
                </div>
            `;
        }

        // Get Initials
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        // Handle Photo Upload
        document.getElementById('photoInput').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            // Validate file size (max 4MB)
            if (file.size > 4 * 1024 * 1024) {
                showAlert('Photo size must be less than 4MB', 'error');
                return;
            }

            // Validate file type
            if (!file.type.startsWith('image/')) {
                showAlert('Please select an image file', 'error');
                return;
            }

            try {
                showAlert('Uploading photo...', 'info');

                const arrayBuffer = await file.arrayBuffer();

                const response = await fetch('https://graph.microsoft.com/v1.0/me/photo/$value', {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': file.type
                    },
                    body: arrayBuffer
                });

                if (response.ok || response.status === 200) {
                    showAlert('Photo updated successfully!', 'success');
                    // Display the new photo
                    const photoUrl = URL.createObjectURL(file);
                    displayPhoto(photoUrl);
                } else {
                    throw new Error('Failed to upload photo');
                }
            } catch (error) {
                console.error('Error uploading photo:', error);
                showAlert('Failed to upload photo. Please try again.', 'error');
            }
        });

        // Handle Form Submit
        document.getElementById('profileUpdateForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const saveButton = document.getElementById('saveButton');
            saveButton.disabled = true;
            saveButton.textContent = 'Saving...';

            try {
                const updateData = {
                    jobTitle: document.getElementById('jobTitle').value,
                    department: document.getElementById('department').value,
                    officeLocation: document.getElementById('officeLocation').value,
                    mobilePhone: document.getElementById('mobilePhone').value,
                    businessPhones: [document.getElementById('businessPhone').value].filter(p => p)
                };

                const response = await fetch('https://graph.microsoft.com/v1.0/me', {
                    method: 'PATCH',
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });

                if (response.ok || response.status === 204) {
                    showAlert('Profile updated successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    throw new Error('Failed to update profile');
                }
            } catch (error) {
                console.error('Error updating profile:', error);
                showAlert('Failed to update profile. Please try again.', 'error');
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = 'Save Changes';
            }
        });

        // Show Alert
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;

            if (type === 'success' || type === 'info') {
                setTimeout(() => {
                    alertContainer.innerHTML = '';
                }, 5000);
            }
        }

        // Hide Loading
        function hideLoading() {
            document.getElementById('loadingScreen').classList.add('hidden');
        }
    </script>
</body>
</html>
