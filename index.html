<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office 365 Employee Directory</title>

    <!-- MSAL.js from CDN -->
    <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .navbar h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .auth-button {
            padding: 0.6rem 1.5rem;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .auth-button:hover {
            background: white;
            color: #667eea;
        }

        .main-content {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .welcome-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
        }

        .welcome-content {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }

        .welcome-content h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 1rem;
        }

        .welcome-content p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .welcome-button {
            padding: 0.9rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .welcome-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .directory-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .directory-header h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .employee-count {
            font-size: 1.1rem;
            color: #666;
        }

        .employee-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: 1rem 0;
        }

        .employee-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .employee-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .employee-photo {
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
        }

        .employee-photo img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #f0f0f0;
        }

        .photo-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #f0f0f0;
        }

        .initials {
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .employee-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .employee-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #333;
        }

        .employee-title {
            font-size: 0.95rem;
            color: #555;
        }

        .employee-department {
            font-size: 0.9rem;
            color: #777;
        }

        .employee-email {
            font-size: 0.85rem;
            color: #0066cc;
            text-decoration: none;
            word-break: break-all;
        }

        .employee-email:hover {
            text-decoration: underline;
        }

        .employee-location {
            font-size: 0.85rem;
            color: #888;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #666;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 1rem;
            border-radius: 6px;
            margin: 2rem auto;
            max-width: 600px;
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-left">
            <h1>Office 365 Employee Directory</h1>
        </div>
        <div class="nav-buttons">
            <a href="profile-v10.html" id="profileLink" class="nav-link" style="display: none;">My Profile</a>
            <button id="authButton" class="auth-button" onclick="handleAuth()">Sign In with Microsoft</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="welcome-container">
            <div class="welcome-content">
                <h2>Welcome to Employee Directory</h2>
                <p>Please sign in with your Microsoft account to view all employees.</p>
                <button class="welcome-button" onclick="signIn()">Sign In with Microsoft</button>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading employees...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error hidden"></div>

        <!-- Employee Directory -->
        <div id="employeeDirectory" class="hidden">
            <div class="directory-header">
                <h2>Employee Directory</h2>
                <p class="employee-count" id="employeeCount">0 employees</p>
            </div>
            <div id="employeeGrid" class="employee-grid"></div>
        </div>
    </div>

    <script>
        // MSAL Configuration
        const msalConfig = {
            auth: {
                clientId: "68d7fcd3-6db4-427e-a2be-f1c8d914b555",
                authority: "https://login.microsoftonline.com/ce5c9e34-9906-4081-8a98-69ec394244f1",
                redirectUri: window.location.origin
            },
            cache: {
                cacheLocation: "sessionStorage",
                storeAuthStateInCookie: false
            }
        };

        const loginRequest = {
            scopes: ["User.Read", "User.Read.All"]
        };

        // Initialize MSAL
        const myMSALObj = new msal.PublicClientApplication(msalConfig);
        let accessToken = null;

        // Check if user is already signed in
        window.addEventListener('load', async () => {
            const accounts = myMSALObj.getAllAccounts();
            if (accounts.length > 0) {
                myMSALObj.setActiveAccount(accounts[0]);
                await getTokenAndLoadEmployees();
            }
        });

        // Sign In
        async function signIn() {
            try {
                const loginResponse = await myMSALObj.loginPopup(loginRequest);
                myMSALObj.setActiveAccount(loginResponse.account);
                await getTokenAndLoadEmployees();
            } catch (error) {
                console.error('Login error:', error);
                showError('Login failed: ' + error.message);
            }
        }

        // Sign Out
        async function signOut() {
            try {
                await myMSALObj.logoutPopup();
                location.reload();
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        // Handle Auth Button
        function handleAuth() {
            const account = myMSALObj.getActiveAccount();
            if (account) {
                signOut();
            } else {
                signIn();
            }
        }

        // Get Access Token
        async function getTokenAndLoadEmployees() {
            try {
                const account = myMSALObj.getActiveAccount();
                if (!account) {
                    throw new Error('No active account');
                }

                const response = await myMSALObj.acquireTokenSilent({
                    ...loginRequest,
                    account: account
                });

                accessToken = response.accessToken;

                // Update UI
                document.getElementById('welcomeScreen').classList.add('hidden');
                document.getElementById('authButton').textContent = 'Sign Out';
                document.getElementById('profileLink').style.display = 'block';

                // Load employees
                await loadEmployees();
            } catch (error) {
                console.error('Token error:', error);
                if (error.name === 'InteractionRequiredAuthError') {
                    signIn();
                } else {
                    showError('Authentication error: ' + error.message);
                }
            }
        }

        // Load Employees
        async function loadEmployees() {
            showLoading();

            try {
                const response = await fetch('https://graph.microsoft.com/v1.0/users?$select=id,displayName,mail,jobTitle,department,officeLocation&$top=999', {
                    headers: {
                        'Authorization': 'Bearer ' + accessToken
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch users: ' + response.statusText);
                }

                const data = await response.json();
                const users = data.value;

                // Fetch photos for all users
                const usersWithPhotos = await Promise.all(users.map(async (user) => {
                    const photoUrl = await getUserPhoto(user.id);
                    return { ...user, photoUrl };
                }));

                displayEmployees(usersWithPhotos);
            } catch (error) {
                console.error('Error loading employees:', error);
                showError('Failed to load employees: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        // Get User Photo
        async function getUserPhoto(userId) {
            try {
                const response = await fetch(`https://graph.microsoft.com/v1.0/users/${userId}/photo/$value`, {
                    headers: {
                        'Authorization': 'Bearer ' + accessToken
                    }
                });

                if (!response.ok) {
                    return null;
                }

                const blob = await response.blob();
                return URL.createObjectURL(blob);
            } catch (error) {
                return null;
            }
        }

        // Display Employees
        function displayEmployees(employees) {
            const grid = document.getElementById('employeeGrid');
            const count = document.getElementById('employeeCount');

            count.textContent = `${employees.length} employees`;
            grid.innerHTML = '';

            employees.forEach(employee => {
                const card = createEmployeeCard(employee);
                grid.appendChild(card);
            });

            document.getElementById('employeeDirectory').classList.remove('hidden');
        }

        // Create Employee Card
        function createEmployeeCard(employee) {
            const card = document.createElement('div');
            card.className = 'employee-card';

            const photoDiv = document.createElement('div');
            photoDiv.className = 'employee-photo';

            if (employee.photoUrl) {
                const img = document.createElement('img');
                img.src = employee.photoUrl;
                img.alt = employee.displayName;
                photoDiv.appendChild(img);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'photo-placeholder';
                const initials = document.createElement('span');
                initials.className = 'initials';
                initials.textContent = getInitials(employee.displayName);
                placeholder.appendChild(initials);
                photoDiv.appendChild(placeholder);
            }

            const infoDiv = document.createElement('div');
            infoDiv.className = 'employee-info';

            const name = document.createElement('div');
            name.className = 'employee-name';
            name.textContent = employee.displayName;
            infoDiv.appendChild(name);

            if (employee.jobTitle) {
                const title = document.createElement('div');
                title.className = 'employee-title';
                title.textContent = employee.jobTitle;
                infoDiv.appendChild(title);
            }

            if (employee.department) {
                const dept = document.createElement('div');
                dept.className = 'employee-department';
                dept.textContent = employee.department;
                infoDiv.appendChild(dept);
            }

            if (employee.mail) {
                const email = document.createElement('a');
                email.className = 'employee-email';
                email.href = 'mailto:' + employee.mail;
                email.textContent = employee.mail;
                infoDiv.appendChild(email);
            }

            if (employee.officeLocation) {
                const location = document.createElement('div');
                location.className = 'employee-location';
                location.textContent = employee.officeLocation;
                infoDiv.appendChild(location);
            }

            card.appendChild(photoDiv);
            card.appendChild(infoDiv);

            return card;
        }

        // Get Initials
        function getInitials(name) {
            if (!name) return '?';
            const parts = name.split(' ');
            if (parts.length >= 2) {
                return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }

        // UI Helper Functions
        function showLoading() {
            document.getElementById('loadingScreen').classList.remove('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingScreen').classList.add('hidden');
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('loadingScreen').classList.add('hidden');
        }
    </script>
</body>
</html>
