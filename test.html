<!DOCTYPE html>
<html>
<head>
    <title>Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 50px;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.5rem;
        }
        .box {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <h1>🎉 Server is Working!</h1>
    <div class="box">
        <h2>If you can see this colorful page, the server is working correctly!</h2>
        <p id="demo">JavaScript is loading...</p>
    </div>

    <script>
        document.getElementById('demo').innerHTML = '✅ JavaScript is working too!';
        console.log('Test page loaded successfully');
    </script>
</body>
</html>
